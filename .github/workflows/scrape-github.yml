name: scrape-github
on:
  schedule:
    - cron: "30 1 * * 1,4"    # 07:00 IST Mon + Thu
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m app.jobs.run_github
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # PAT_TOKEN is a user-created PAT with repo:read scope.
          # Falls back to the runner-injected GITHUB_TOKEN if PAT_TOKEN isn't set.
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          APP_ENV: production
