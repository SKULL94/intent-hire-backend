name: scrape-adzuna
on:
  schedule:
    # 07:30 IST daily — after scrape-ats (06:00) and before score (10:00), so
    # the day's scoring run sees both job sources.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      what:
        description: "Space-separated search terms (default: flutter dart)"
        required: false
        default: "flutter dart"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Harvest postings
        run: python -m app.jobs.run_adzuna --what ${{ github.event.inputs.what || 'flutter dart' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Both halves are required; Adzuna 401s if either is missing.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          APP_ENV: production
