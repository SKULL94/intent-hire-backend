name: discover-companies
on:
  schedule:
    # 09:00 IST on Sundays. Weekly rather than daily: the set of organizations
    # owning public Dart repositories moves slowly, and each run hydrates many
    # GitHub orgs and probes five ATS APIs per candidate.
    - cron: "30 3 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max orgs to hydrate"
        required: false
        default: "150"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover Flutter companies
        run: python -m app.jobs.run_discovery --limit ${{ github.event.inputs.limit || '150' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          APP_ENV: production
